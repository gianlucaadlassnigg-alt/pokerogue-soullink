<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Link Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f17; --bg2: #141826; --card: #181d2d; --line: #262c42; --text: #eef0f7; --muted: #8e95ad;
    --a: #ff6b8a; --b: #6bc7ff; --alive: #3ddc84; --dead: #ff5c5c; --wait: #f5b942; --gone: #7d839a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; min-height: 100vh;
    background: radial-gradient(1200px 500px at 15% -10%, rgba(255,107,138,.12), transparent 60%),
                radial-gradient(1200px 500px at 85% -10%, rgba(107,199,255,.12), transparent 60%), var(--bg); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .logo { font-weight: 800; font-size: 30px; letter-spacing: -.02em; line-height: 1; }
  .logo span { background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .room { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--muted); background: var(--bg2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; }
  .spacer { flex: 1; }
  .btn { font: inherit; font-weight: 700; background: var(--bg2); color: var(--text); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; font-size: 14px; }
  .btn:hover { border-color: #3a4260; }
  .btn.primary { background: var(--a); color: #1a0b10; border-color: transparent; }

  .players { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: stretch; margin-bottom: 26px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; position: relative; overflow: hidden; }
  .pcard::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--pc); }
  .pcard.right { text-align: right; } .pcard.right::before { inset: 0 0 0 auto; }
  .pname { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .pcard.right .pname { justify-content: flex-end; }
  .online { width: 9px; height: 9px; border-radius: 50%; background: var(--gone); }
  .online.on { background: var(--alive); box-shadow: 0 0 0 4px rgba(61,220,132,.15); }
  .pmeta { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .stats { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .pcard.right .stats { justify-content: flex-end; }
  .stats b { display: block; font-size: 22px; color: var(--text); font-family: "JetBrains Mono", monospace; }
  .vs { display: grid; place-items: center; font-size: 28px; color: var(--muted); padding: 0 4px; }

  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
  .pairs { display: grid; gap: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
  .pair.dead { background: linear-gradient(90deg, rgba(255,92,92,.06), rgba(255,92,92,.02)); border-color: #4a2430; }
  .pair.broken { opacity: .6; }
  .mid { text-align: center; }
  .mid .t { font-weight: 800; font-size: 14px; }
  .mid .s { color: var(--muted); font-size: 11px; }
  .chain { font-size: 18px; margin: 2px 0; }
  .alive .chain { color: var(--alive); } .dead .chain { color: var(--dead); } .waiting .chain { color: var(--wait); } .broken .chain { color: var(--gone); }
  .mon { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mon.r { flex-direction: row-reverse; text-align: right; }
  .sprite { width: 64px; height: 64px; flex: none; image-rendering: pixelated; border-radius: 12px; background: var(--bg2); display: grid; place-items: center; }
  .sprite img { width: 64px; height: 64px; image-rendering: pixelated; }
  .mon.dead .sprite img { filter: grayscale(1) brightness(.6); }
  .mon.gone .sprite img { filter: grayscale(1) opacity(.45); }
  .mname { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mon.dead .mname, .mon.gone .mname { text-decoration: line-through; text-decoration-thickness: 2px; }
  .msub { color: var(--muted); font-size: 12px; }
  .hp { height: 5px; background: var(--bg2); border-radius: 99px; margin-top: 5px; overflow: hidden; width: 100%; max-width: 140px; }
  .mon.r .hp { margin-left: auto; }
  .hp i { display: block; height: 100%; background: var(--alive); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--bg2); border: 1px solid var(--line); }
  .tag.dead { color: var(--dead); border-color: #5c2a33; } .tag.gone { color: var(--muted); } .tag.dup { color: var(--wait); border-color: #5e4c1c; }
  .empty { color: var(--muted); font-style: italic; font-size: 14px; }

  .side { display: grid; gap: 22px; position: sticky; top: 16px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 420px; overflow-y: auto; }
  .feed li { font-size: 14px; line-height: 1.35; }
  .feed .who { font-weight: 800; }
  .feed .time { color: var(--muted); font-size: 11px; font-family: "JetBrains Mono", monospace; }
  .feed .death { color: #ffb3bf; }
  .grave { display: grid; gap: 6px; }
  .grave div { font-size: 14px; display: flex; gap: 6px; align-items: center; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .toggles { display: grid; gap: 8px; margin: 10px 0; }
  .toggles label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  input[type=password], input[type=text] { font: inherit; width: 100%; background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .msg { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1em; }

  .landing { max-width: 640px; margin: 60px auto; }
  .landing h1 { font-size: 46px; line-height: 1.02; margin: 0 0 14px; letter-spacing: -.03em; }
  .landing p { color: var(--muted); font-size: 17px; line-height: 1.5; }
  .landing form { display: flex; gap: 10px; margin: 24px 0; }
  .steps { counter-reset: s; display: grid; gap: 12px; margin-top: 28px; padding: 0; list-style: none; }
  .steps li { counter-increment: s; display: flex; gap: 12px; font-size: 15px; line-height: 1.45; }
  .steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--bg2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  code { font-family: "JetBrains Mono", monospace; font-size: 13px; background: var(--bg2); padding: 1px 6px; border-radius: 6px; }

  .status { margin-top: 10px; font-size: 13px; font-weight: 700; display: inline-block; padding: 3px 9px; border-radius: 99px; background: var(--bg2); }
  .status.wait { color: #9fd0ff; } .status.no { color: #ffb3bf; } .status.yes { color: #a6f0c6; }
  .pcard .status + .status { margin-left: 6px; }
  .cmp { width: 100%; border-collapse: collapse; font-size: 15px; }
  .cmp th, .cmp td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  .cmp thead th { font-size: 16px; font-weight: 800; }
  .cmp tbody th { text-align: left; color: var(--muted); font-weight: 500; }
  .cmp td { font-family: "JetBrains Mono", monospace; }
  .cmp td.lead { color: var(--alive); font-weight: 700; }
  .cmp td.lead::before { content: "▲ "; font-size: 10px; }
  .cmp tr:last-child th, .cmp tr:last-child td { border-bottom: 0; }
  .hls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .hl { background: var(--bg2); border-radius: 12px; padding: 10px 12px; border-top: 3px solid var(--pc); }
  .hlname { font-weight: 800; margin-bottom: 6px; color: var(--pc); }
  .hlrow { display: flex; flex-direction: column; gap: 1px; padding: 5px 0; font-size: 12px; color: var(--muted); }
  .hlrow b { color: var(--text); font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .hlrow img { width: 28px; height: 28px; image-rendering: pixelated; margin: -6px 0; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { position: static; } }
  @media (max-width: 620px) {
    .players { grid-template-columns: 1fr 1fr; } .vs { display: none; }
    .pair { grid-template-columns: 1fr 64px 1fr; padding: 8px; }
    .sprite, .sprite img { width: 44px; height: 44px; }
    .mname { font-size: 14px; } .mid .s { display: none; }
    .logo { font-size: 24px; }
    .hls { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const roomId = decodeURIComponent((location.pathname.match(/^\/r\/([^/]+)/) || [])[1] || "");
const app = $("#app");
const POKEBALL = `<svg viewBox="0 0 24 24" width="30" height="30"><circle cx="12" cy="12" r="10" fill="none" stroke="#3a4260" stroke-width="2"/><path d="M2 12h20" stroke="#3a4260" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#141826" stroke="#3a4260" stroke-width="2"/></svg>`;
const sprite = (m) => m && m.speciesId > 0 && m.speciesId <= 1025
  ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${m.shiny ? "shiny/" : ""}${m.speciesId}.png` : "";
const ago = (ts) => { const s = Math.round((Date.now() - ts) / 1000); if (s < 60) return `${s}s`; if (s < 3600) return `${Math.round(s/60)} min`; if (s < 86400) return `${Math.round(s/3600)} h`; return `${Math.round(s/86400)} T`; };
const RULES = {
  forceNickname: "Nach dem Fangen muss ein Spitzname vergeben werden",
  blockCatchAfterFirst: "Nach dem ersten Fang im Abschnitt ist das Ball-Menü gesperrt",
  biomeDupeClause: "In einem Biom, in dem man schon gefangen hat, darf man später nicht mehr fangen",
  waitAtBosses: "Vor Biom-Boss, Rivale, Top 4 und Champ auf den Partner warten",
  releaseOnPartnerDeath: "Partner-Pokémon stirbt → eigenes wird freigelassen",
  releaseOnPartnerGone: "Partner lässt frei / verliert sein Pokémon → eigenes auch",
  releaseIfPartnerMissed: "Partner fängt im Abschnitt nichts → eigenes Pokémon geht",
  releaseOwnDead: "Eigene KO-Pokémon gelten als tot und werden freigelassen",
  releaseDuplicates: "Zweitfänge im selben Abschnitt automatisch freilassen",
};

if (!roomId) renderLanding(); else start();

function renderLanding() {
  document.title = "Soul Link Tracker";
  app.innerHTML = `<div class="landing">
    <div class="logo" style="margin-bottom:28px">Soul <span>Link</span></div>
    <h1>Zwei Runs. Eine Kette.</h1>
    <p>Live-Tracker für PokeRogue-Soul-Link-Nuzlockes. Das Script im Spiel trägt Fänge und Tode automatisch ein – und lässt das verlinkte Pokémon frei, wenn der Partner eins verliert.</p>
    <form id="go"><input type="text" name="room" placeholder="Raum-Name, z. B. gianluca-und-max" required><button class="btn primary">Öffnen</button></form>
    <ol class="steps">
      <li><span>Tampermonkey im Browser installieren (Chrome, Edge, Brave oder Opera).</span></li>
      <li><span><a class="btn" href="/soullink.user.js" style="padding:4px 10px">Soul-Link-Script installieren</a> – die Server-Adresse ist schon eingetragen.</span></li>
      <li><span><code>pokerogue.net</code> öffnen, oben rechts im Overlay Raum, Namen und Passwort eintragen. Beide nehmen denselben Raum und dasselbe Passwort.</span></li>
      <li><span>Hier den Raum öffnen und zuschauen.</span></li>
    </ol></div>`;
  $("#go").onsubmit = (e) => { e.preventDefault(); location.href = "/r/" + encodeURIComponent(new FormData(e.target).get("room").trim()); };
}

let data = null, err = "";
async function load() {
  try {
    const r = await fetch(`/api/room/${encodeURIComponent(roomId)}`, { cache: "no-store" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    data = j; err = "";
  } catch (e) { err = e.message; }
  render();
}
function start() {
  document.title = `Soul Link · ${roomId}`;
  load();
  setInterval(load, 3000);
}

function monBlock(slot, right) {
  const m = slot?.mon;
  if (!m) {
    const t = slot?.status === "missed" ? "Nichts gefangen" : "Noch kein Fang";
    return `<div class="mon ${right ? "r" : ""}"><div class="sprite">${POKEBALL}</div><div class="empty">${t}</div></div>`;
  }
  const img = sprite(m);
  const pct = m.maxHp ? Math.max(0, Math.min(100, Math.round(m.hp / m.maxHp * 100))) : 0;
  let tag = "";
  if (m.status === "dead") tag = `<span class="tag dead">💀 W${m.diedWave ?? "?"} · ${esc(m.diedBiomeName || "")}</span>`;
  else if (m.status === "gone") tag = `<span class="tag gone" title="${esc(m.goneReason || "")}">🕊️ freigelassen</span>`;
  const dups = slot.duplicates?.length ? ` <span class="tag dup" title="${esc(slot.duplicates.map(d => d.nick || d.name).join(", "))}">+${slot.duplicates.length} Zweitfang</span>` : "";
  const name = m.nick && m.nick !== m.name ? `${esc(m.nick)} <span class="msub">(${esc(m.name)})</span>` : esc(m.name);
  return `<div class="mon ${right ? "r" : ""} ${m.status}">
    <div class="sprite">${img ? `<img src="${img}" alt="" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(POKEBALL))">` : POKEBALL}</div>
    <div style="min-width:0;flex:1">
      <div class="mname">${m.shiny ? "✨ " : ""}${name}</div>
      <div class="msub">Lv ${m.level}${m.fusionName ? ` · Fusion mit ${esc(m.fusionName)}` : ""} · ${esc(m.metBiomeName)}${m.metWave > 0 ? ` W${m.metWave}` : ""}</div>
      ${m.status === "alive" ? `<div class="hp"><i style="width:${pct}%;background:${pct < 25 ? "var(--dead)" : pct < 50 ? "var(--wait)" : "var(--alive)"}"></i></div>` : `<div style="margin-top:4px">${tag}</div>`}
      ${dups ? `<div style="margin-top:4px">${dups}</div>` : ""}
    </div></div>`;
}

function playerCard(p, side) {
  const color = side === 0 ? "var(--a)" : "var(--b)";
  if (!p) return `<div class="pcard ${side ? "right" : ""}" style="--pc:${color}"><div class="pname">Wartet …</div><div class="pmeta">Noch kein zweiter Spieler im Raum</div></div>`;
  const mons = p.run?.mons || [];
  const alive = mons.filter(m => m.status === "alive" && m.inParty).length;
  const dead = mons.filter(m => m.status === "dead").length;
  const meta = p.run ? `Welle ${p.run.wave} · ${esc(p.run.biomeName)}${p.run.over ? " · ☠️ Run vorbei" : ""}` : "Noch nicht im Run";
  return `<div class="pcard ${side ? "right" : ""}" style="--pc:${color}">
    <div class="pname">${side ? "" : `<span class="online ${p.online ? "on" : ""}"></span>`}${esc(p.name)}${side ? `<span class="online ${p.online ? "on" : ""}"></span>` : ""}</div>
    <div class="pmeta">${meta} · ${p.online ? "spielt gerade" : "zuletzt vor " + ago(p.lastSeen)}</div>
    <div class="stats"><div><b>${p.run?.wave ?? 0}</b>Welle</div><div><b>${alive}</b>im Team</div><div><b>${dead}</b>tot</div></div>
    ${p.run?.waiting ? `<div class="status wait">⏳ Wartet vor „${esc(p.run.waiting.label)}“ (Welle ${p.run.waiting.wave})</div>` : ""}
    ${p.run && !p.run.over ? (p.run.catchBlocked ? `<div class="status no">🚫 Fangen gesperrt</div>` : `<div class="status yes">🎯 Darf hier fangen</div>`) : ""}</div>`;
}

function statsBlock(A, B) {
  const players = [A, B].filter(Boolean);
  if (!players.length || !players.some(p => p.stats?.runs)) return "";
  const rows = [
    ["Runs", "runs", 0],
    ["Beste Welle", "bestWave", 1],
    ["Ø Welle", "avgWave", 1],
    ["Fänge", "catches", 1],
    ["Tode", "deaths", -1],
    ["Tode pro Run", "deathsPerRun", -1],
    ["Shinys", "shinies", 1],
  ];
  const cell = (p, key, better) => {
    const v = p?.stats?.[key] ?? 0;
    let lead = false;
    if (players.length === 2 && better) {
      const o = (p === A ? B : A)?.stats?.[key] ?? 0;
      lead = better > 0 ? v > o : v < o;
    }
    return `<td class="${lead ? "lead" : ""}">${v}</td>`;
  };
  const card = (p, side) => {
    if (!p) return "";
    const s = p.stats || {};
    const color = side ? "var(--b)" : "var(--a)";
    const mini = (m) => m && m.speciesId > 0 && m.speciesId <= 1025 ? `<img src="${sprite(m)}" alt="" onerror="this.remove()">` : "";
    return `<div class="hl" style="--pc:${color}"><div class="hlname">${esc(p.name)}</div>
      <div class="hlrow"><span>🏆 Längster Überlebender</span><b>${s.survivor ? `${mini(s.survivor)}${esc(s.survivor.name)} · ${s.survivor.waves} Wellen` : "–"}</b></div>
      <div class="hlrow"><span>💪 Höchstes Level</span><b>${s.topLevel ? `${mini(s.topLevel)}${esc(s.topLevel.name)} · Lv ${s.topLevel.level}` : "–"}</b></div>
      <div class="hlrow"><span>☠️ Tödlichstes Biom</span><b>${s.deadliestBiome ? `${esc(s.deadliestBiome.name)} · ${s.deadliestBiome.count}×` : "–"}</b></div></div>`;
  };
  return `<h2 style="margin-top:28px">Statistiken · alle Runs</h2>
    <div class="box"><table class="cmp"><thead><tr><th></th>${players.map((p, i) => `<th style="color:${i ? "var(--b)" : "var(--a)"}">${esc(p.name)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(([label, key, better]) => `<tr><th>${label}</th>${players.map(p => cell(p, key, better)).join("")}</tr>`).join("")}</tbody></table>
      <div class="hls">${card(A, 0)}${card(B, 1)}</div></div>`;
}

let settingsOpen = false;
function render() {
  if (!data) {
    app.innerHTML = `<header><div class="logo">Soul <span>Link</span></div><span class="room">${esc(roomId)}</span></header>
      <div class="box"><div class="empty">${err ? esc(err) : "Lade …"}</div></div>`;
    return;
  }
  if (document.activeElement && document.activeElement.closest?.("#settings")) return; // nicht beim Tippen neu zeichnen
  const [A, B] = data.players;
  const pairs = data.pairs.slice().reverse();
  const graves = data.pairs.filter(p => p.state === "dead");
  app.innerHTML = `
    <header><div class="logo">Soul <span>Link</span></div><span class="room">${esc(data.room)}</span><div class="spacer"></div>
      ${err ? `<span class="msub" style="color:var(--dead)">Verbindung: ${esc(err)}</span>` : ""}
      <a class="btn" href="/soullink.user.js">Script installieren</a></header>
    <section class="players">${playerCard(A, 0)}<div class="vs">⛓</div>${playerCard(B, 1)}</section>
    <div class="layout">
      <section><h2>Verlinkte Paare · ${data.pairs.filter(p => p.state === "alive").length} leben</h2>
        <div class="pairs">${pairs.length ? pairs.map(p => `
          <div class="pair ${p.state}">
            ${monBlock(p.slots[0], false)}
            <div class="mid"><div class="t">${esc(p.title)}</div><div class="chain">${p.state === "dead" ? "✖" : p.state === "broken" ? "⛓️‍💥" : "⛓"}</div><div class="s">${esc(p.sub)}</div></div>
            ${monBlock(p.slots[1], true)}
          </div>`).join("") : `<div class="box empty">Sobald ihr Starter wählt, erscheinen hier die Paare.</div>`}</div>
        ${statsBlock(A, B)}
      </section>
      <aside class="side">
        <div><h2>Live-Feed</h2><div class="box"><ul class="feed">${data.events.length ? data.events.map(e => `
          <li class="${e.type}"><span class="time">${ago(e.ts)}</span> ${e.player ? `<span class="who" style="color:${e.player === A?.name ? "var(--a)" : "var(--b)"}">${esc(e.player)}</span> ` : ""}${esc(e.text)}</li>`).join("") : `<li class="empty">Noch nichts passiert.</li>`}</ul></div></div>
        <div><h2>Friedhof · ${graves.length}</h2><div class="box grave">${graves.length ? graves.map(p => `<div>🪦 ${p.slots.map(s => esc(s.mon ? (s.mon.nick || s.mon.name) : "–")).join(" ⛓ ")} <span class="msub">· ${esc(p.title)}</span></div>`).join("") : `<span class="empty">Noch niemand. Bleibt so.</span>`}</div></div>
        ${data.history.length ? `<div><h2>Frühere Runs</h2><div class="box grave">${data.history.slice(0, 10).map(h => `<div><b style="color:${h.player === A?.name ? "var(--a)" : "var(--b)"}">${esc(h.player)}</b>&nbsp;bis Welle ${h.wave} · ${h.deaths} tot <span class="msub">· vor ${ago(h.endedAt)}</span></div>`).join("")}</div></div>` : ""}
        <div><h2>Regeln</h2><div class="box" id="settings">
          <details ${settingsOpen ? "open" : ""}><summary>Regeln anzeigen / ändern</summary>
            <div class="toggles">${Object.entries(RULES).map(([k, t]) => `<label><input type="checkbox" name="${k}" ${data.settings[k] ? "checked" : ""}> ${t}</label>`).join("")}</div>
            <input type="password" id="pw" placeholder="Raum-Passwort">
            <div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" id="saveRules">Speichern</button><button class="btn" id="reset">Raum zurücksetzen</button></div>
            <div class="msg" id="msg"></div>
          </details></div></div>
      </aside>
    </div>`;
  const det = $("#settings details");
  det.ontoggle = () => { settingsOpen = det.open; };
  $("#saveRules").onclick = () => post("settings", { settings: Object.fromEntries(Object.keys(RULES).map(k => [k, $(`#settings [name=${k}]`).checked])) });
  $("#reset").onclick = () => { if (confirm("Feed, Verlauf und Runs im Raum löschen?")) post("reset", {}); };
}

async function post(what, extra) {
  const msg = $("#msg");
  try {
    const r = await fetch(`/api/room/${encodeURIComponent(roomId)}/${what}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ secret: $("#pw").value, ...extra }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    document.activeElement?.blur();
    msg.textContent = "Gespeichert ✓";
    setTimeout(load, 200);
  } catch (e) { msg.textContent = e.message; }
}
</script>
</body>
</html>
